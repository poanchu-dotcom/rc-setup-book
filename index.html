<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>RC Setup Book</title>
  <style>
    :root { --blue:#0a84ff; --ink:#111318; --muted:#6e7180; --line:#e7e7ec; --wash:#f4f4f8; --card:#fff; --green:#32a85a; --amber-bg:#ffefc2; --amber-accent:#d97706; --amber-ink:#92400e; }
    * { box-sizing:border-box; }
    body { margin:0; background:#dedfe5; color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC",sans-serif; letter-spacing:-.01em; }
    button, input { font:inherit; }
    .phone { min-height:100vh; max-width:430px; margin:auto; background:var(--wash); padding:env(safe-area-inset-top, 20px) 16px calc(88px + env(safe-area-inset-bottom)); }
    header { display:flex; justify-content:space-between; align-items:center; padding:14px 4px 20px; }
    h1 { margin:0; font-size:34px; letter-spacing:-1.3px; }
    .more { border:0; background:transparent; color:var(--blue); font-size:17px; padding:8px 3px; cursor:pointer; }
    .model-card { background:linear-gradient(135deg,#18202d,#323e51); color:#fff; border-radius:24px; padding:21px; box-shadow:0 10px 24px #1c223122; }
    .eyebrow { margin:0 0 12px; color:#bfc8d9; font-size:13px; font-weight:600; display:flex; align-items:center; justify-content:space-between; }
    .eyebrow strong { color:#fff; font-weight:700; }
    .meta-fields { display:grid; grid-template-columns:1fr 136px; gap:10px; }
    .meta-field { display:flex; flex-direction:column; gap:4px; }
    .meta-field.full { grid-column:1 / -1; }
    .meta-field span { font-size:11px; color:#aeb9cc; font-weight:600; letter-spacing:.02em; }
    .meta-input { width:100%; border:0; border-bottom:1px solid #ffffff55; border-radius:0; background:transparent; color:#fff; padding:3px 0 5px; font-size:16px; font-weight:600; outline:none; color-scheme:dark; }
    .meta-input::placeholder { color:#ffffff60; font-weight:400; }
    .meta-input:focus { border-bottom-color:#fff; }
    .track-chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:4px; }
    .track-chip { border:1px solid #ffffff30; border-radius:99px; background:#ffffff14; color:#e5ecf7; padding:3px 10px; font-size:12px; font-weight:600; cursor:pointer; transition:.15s; }
    .track-chip:active { transform:scale(.96); }
    .track-chip.active { background:#fff; color:#18202d; border-color:#fff; }
    .model-meta { display:flex; justify-content:space-between; align-items:flex-end; margin-top:18px; }
    .model-meta span { font-size:13px; color:#d4dbe6; }
    .saved { color:#96e6b1 !important; font-weight:600; }
    .setup-actions { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
    .setup-action { border:0; border-radius:12px; background:#ffffff20; color:#fff; padding:12px 8px; font-size:14px; font-weight:600; cursor:pointer; }
    .setup-action:active { background:#ffffff35; }
    .section-title { display:flex; align-items:center; justify-content:space-between; margin:28px 4px 10px; }
    .section-title h3 { margin:0; font-size:20px; letter-spacing:-.45px; }
    .section-title small { color:var(--muted); font-size:13px; }
    .group { overflow:hidden; background:var(--card); border-radius:16px; box-shadow:0 1px 1px #11111108; }
    .row { display:grid; grid-template-columns:1fr 86px 86px; align-items:center; min-height:57px; margin-left:16px; padding-right:6px; border-bottom:1px solid var(--line); }
    .row:last-child { border-bottom:0; }
    .name { font-size:15.5px; font-weight:520; }
    .en-sub { color:var(--muted); font-size:13px; font-weight:500; }
    .unit { margin-left:4px; color:var(--muted); font-size:12px; font-weight:400; }
    .value { border:0; width:100%; background:transparent; padding:8px 4px; text-align:center; color:var(--blue); font-size:16px; font-weight:600; outline:none; }
    .value:focus { background:#eaf4ff; border-radius:8px; }
    .head { min-height:34px; border:0; color:var(--muted); font-size:12px; font-weight:500; }
    .single .row { grid-template-columns:1fr 184px; }
    .diff-control { display:flex; align-items:center; gap:6px; padding-right:8px; }
    .diff-control .value { flex:1; min-width:0; }
    .spool-btn { border:1px solid #d5d8e2; border-radius:8px; background:#f6f7fa; color:var(--muted); padding:6px 10px; font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap; transition:.15s; }
    .spool-btn.active { background:var(--blue); border-color:var(--blue); color:#fff; }
    .add { width:100%; border:0; background:transparent; color:var(--blue); padding:17px; font-size:16px; font-weight:600; }
    .bottom { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:min(430px,100%); padding:11px 16px calc(11px + env(safe-area-inset-bottom)); background:#f4f4f8eF; backdrop-filter:blur(12px); border-top:1px solid #e6e6eb; }
    .save { width:100%; border:0; border-radius:15px; padding:16px; background:var(--blue); color:#fff; font-size:17px; font-weight:650; box-shadow:0 4px 10px #0a84ff35; cursor:pointer; }
    .save:active { opacity:.9; }
    /* 束角專用鍵盤負號快捷列 */
    .sign-bar { position:fixed; z-index:10; left:50%; transform:translateX(-50%); bottom:0; width:min(430px,100%); display:none; align-items:center; justify-content:space-between; gap:8px; padding:8px 12px; background:#d1d5db; border-top:1px solid #b8bec7; box-shadow:0 -4px 14px #00000018; }
    .sign-bar.show { display:flex; }
    .sign-bar-label { font-size:12px; color:#374151; font-weight:600; padding-left:4px; }
    .sign-bar-actions { display:flex; align-items:center; gap:6px; }
    .sign-key { border:0; border-radius:8px; background:#fff; color:var(--ink); min-width:54px; height:38px; padding:0 12px; font-size:18px; font-weight:700; box-shadow:0 1px 2px #00000025; cursor:pointer; }
    .sign-key:active { background:#e5e7eb; }
    .sign-key.primary { background:var(--blue); color:#fff; font-size:14px; font-weight:600; }
    .sign-key.secondary { background:#e5e7eb; color:#374151; font-size:13px; font-weight:600; }
    .history { margin-top:10px; }
    .history-item { display:flex; align-items:center; border-bottom:1px solid var(--line); }
    .history-item:last-child { border-bottom:0; }
    .history-item.active { background:#edf6ff; }
    .history-select { flex:1; display:flex; align-items:center; justify-content:space-between; gap:12px; border:0; background:transparent; padding:14px 8px 14px 16px; text-align:left; color:var(--ink); cursor:pointer; min-width:0; }
    .history-select > span:first-child { min-width:0; flex:1; }
    .history-name { display:block; font-size:15px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .history-note { display:block; margin-top:2px; color:#3d4252; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .history-date { display:block; margin-top:3px; color:var(--muted); font-size:12px; }
    .history-arrow { color:var(--blue); font-size:18px; }
    .chassis-list { margin:12px 16px; overflow:hidden; border-radius:14px; background:var(--card); }
    .chassis-item { display:flex; align-items:center; border-bottom:1px solid var(--line); }
    .chassis-item:last-child { border-bottom:0; }
    .chassis-item.active { background:#edf6ff; }
    .chassis-select { flex:1; display:flex; align-items:center; justify-content:space-between; border:0; background:transparent; color:var(--ink); padding:14px 8px 14px 14px; text-align:left; cursor:pointer; }
    .chassis-item small { color:var(--muted); }
    .delete-inline { border:0; border-left:1px solid var(--line); background:transparent; color:#d83a3a; padding:10px 14px; font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap; }
    .delete-inline:disabled { color:#b8bac4; cursor:not-allowed; }
    .new-chassis { display:grid; grid-template-columns:1fr auto; gap:8px; padding:0 16px 18px; }
    .new-chassis input { min-width:0; border:1px solid var(--line); border-radius:10px; padding:10px; background:var(--card); color:var(--ink); }
    .new-chassis button { border:0; border-radius:10px; padding:10px 14px; background:var(--blue); color:#fff; font-weight:600; cursor:pointer; }
    dialog { width:min(430px, calc(100% - 24px)); max-height:84vh; padding:0; border:0; border-radius:22px; background:var(--wash); color:var(--ink); box-shadow:0 18px 48px #11182755; }
    dialog::backdrop { background:#11182775; }
    .dialog-head { position:sticky; top:0; z-index:1; display:flex; align-items:center; justify-content:space-between; padding:16px 18px 12px; background:var(--card); border-bottom:1px solid var(--line); }
    .dialog-head h2 { margin:0; font-size:20px; }
    .close { border:0; background:transparent; color:var(--blue); padding:7px; font-size:15px; font-weight:600; cursor:pointer; }
    .compare-choice { display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:12px 16px 8px; }
    .compare-choice label { display:flex; flex-direction:column; gap:5px; color:var(--muted); font-size:12px; }
    select { width:100%; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--ink); padding:9px; font-size:14px; }
    .compare-toolbar { display:flex; align-items:center; justify-content:space-between; padding:4px 18px 10px; font-size:13px; color:var(--muted); }
    .compare-filter { display:inline-flex; align-items:center; gap:6px; color:var(--ink); font-weight:500; cursor:pointer; }
    .compare-filter input { accent-color:var(--amber-accent); width:16px; height:16px; margin:0; }
    .diff-badge { display:inline-block; padding:2px 8px; border-radius:99px; background:var(--amber-bg); color:var(--amber-ink); font-size:12px; font-weight:650; }
    .comparison { margin:0 16px 16px; overflow:hidden; background:var(--card); border-radius:14px; }
    .comparison-row { display:grid; grid-template-columns:1.25fr .78fr .78fr; align-items:center; padding:11px 12px; border-bottom:1px solid var(--line); font-size:13px; border-left:4px solid transparent; }
    .comparison-row:last-child { border-bottom:0; }
    .comparison-row.changed { background:var(--amber-bg); border-left-color:var(--amber-accent); }
    .comparison-row.changed span:first-child { color:var(--amber-ink); font-weight:700; }
    .comparison-row span:not(:first-child) { text-align:center; color:var(--blue); font-weight:600; }
    .comparison-row.changed span:not(:first-child) { color:var(--amber-ink); font-weight:750; }
    .comparison-row.heading { color:var(--muted); font-size:12px; background:#fafafa; }
    .comparison-row.heading span { color:var(--muted); font-weight:600; }
    .comparison-empty { padding:24px 16px; text-align:center; color:var(--muted); font-size:14px; }
    .toast { position:fixed; z-index:2; left:50%; transform:translate(-50%,20px); bottom:86px; opacity:0; transition:.25s; background:#202126; color:#fff; padding:10px 15px; border-radius:22px; font-size:14px; pointer-events:none; }
    .toast.show { transform:translate(-50%,0); opacity:1; }
    @media (min-width:431px) { .phone { min-height:844px; margin-top:12px; margin-bottom:12px; border-radius:34px; box-shadow:0 18px 55px #29304338; } }
  </style>
</head>
<body>
  <main class="phone">
    <header><h1>RC Setup Record</h1><button class="more" id="manage-chassis" type="button">車架</button></header>
    <section class="model-card" aria-label="目前的 RC 模型設定">
      <p class="eyebrow"><span>目前車架：<strong id="chassis-display">RC Touring</strong></span></p>
      <div class="meta-fields">
        <label class="meta-field">
          <span>場地</span>
          <input class="meta-input" id="setup-track" type="text" placeholder="點選或輸入場地" aria-label="場地">
        </label>
        <label class="meta-field">
          <span>日期</span>
          <input class="meta-input" id="setup-date" type="date" aria-label="日期">
        </label>
        <div class="meta-field full">
          <div class="track-chips" id="track-chips" aria-label="常用場地快速選單">
            <button class="track-chip" type="button" data-track="萬板">萬板</button>
            <button class="track-chip" type="button" data-track="二重">二重</button>
            <button class="track-chip" type="button" data-track="柑園">柑園</button>
            <button class="track-chip" type="button" data-track="道南">道南</button>
          </div>
        </div>
        <label class="meta-field full">
          <span>備註</span>
          <input class="meta-input" id="setup-note" type="text" placeholder="輸入備註（輪胎、胎水、測試重點）" aria-label="備註">
        </label>
      </div>
      <div class="model-meta"><span id="created-at">建立：—</span><span class="saved" id="status">已儲存</span></div>
      <div class="model-meta"><span id="updated-at">最後儲存：—</span><span></span></div>
      <div class="setup-actions"><button class="setup-action" id="new-version" type="button">新建設定</button><button class="setup-action" id="compare" type="button">設定比較</button></div>
    </section>

    <div class="section-title"><h3>已儲存版本</h3><small id="history-count">1 個版本</small></div>
    <section class="group history" id="history" aria-label="已儲存版本"></section>

    <div class="section-title"><h3>底盤幾何</h3><small>前 / 後</small></div>
    <section class="group" id="geometry">
      <div class="row head"><span></span><span>前</span><span>後</span></div>
      <div class="row"><span class="name">車高 <span class="unit">mm</span></span><input class="value" type="text" inputmode="decimal" value="5.0" aria-label="車高 前，單位 mm"><input class="value" type="text" inputmode="decimal" value="5.2" aria-label="車高 後，單位 mm"></div>
      <div class="row"><span class="name">傾角 <span class="en-sub">Camber</span> <span class="unit">°</span></span><input class="value" type="text" inputmode="decimal" value="2" aria-label="傾角 Camber 前，單位 度"><input class="value" type="text" inputmode="decimal" value="2" aria-label="傾角 Camber 後，單位 度"></div>
      <div class="row"><span class="name">後傾角 <span class="en-sub">Caster</span> <span class="unit">°</span></span><input class="value" type="text" inputmode="decimal" value="4" aria-label="後傾角 Caster 前，單位 度"><input class="value" type="text" inputmode="decimal" value="2" aria-label="後傾角 Caster 後，單位 度"></div>
      <div class="row"><span class="name">束角 <span class="en-sub">Toe</span> <span class="unit">°</span></span><input class="value toe-input" type="text" inputmode="decimal" value="-1" aria-label="束角 Toe 前，單位 度"><input class="value toe-input" type="text" inputmode="decimal" value="2" aria-label="束角 Toe 後，單位 度"></div>
      <div class="row"><span class="name">上抬 <span class="unit">mm</span></span><input class="value" type="text" inputmode="decimal" value="22.6" aria-label="上抬 前，單位 mm"><input class="value" type="text" inputmode="decimal" value="21.8" aria-label="上抬 後，單位 mm"></div>
    </section>

    <div class="section-title"><h3>懸吊與避震</h3><small>前 / 後</small></div>
    <section class="group">
      <div class="row head"><span></span><span>前</span><span>後</span></div>
      <div class="row"><span class="name">彈簧</span><input class="value" type="text" inputmode="decimal" value="2.8" aria-label="彈簧 前"><input class="value" type="text" inputmode="decimal" value="2.8" aria-label="彈簧 後"></div>
      <div class="row"><span class="name">避震墊片</span><input class="value" type="text" inputmode="decimal" value="2" aria-label="避震墊片 前"><input class="value" type="text" inputmode="decimal" value="0" aria-label="避震墊片 後"></div>
    </section>

    <div class="section-title"><h3>差速器</h3><small>K / 直軸</small></div>
    <section class="group single">
      <div class="row">
        <span class="name">前差速 <span class="unit">K</span></span>
        <div class="diff-control">
          <input class="value diff-input" id="diff-front" type="text" inputmode="decimal" value="" placeholder="油號(K)" aria-label="前差速，單位 K">
          <button class="spool-btn" type="button" data-spool-target="diff-front">直軸</button>
        </div>
      </div>
      <div class="row">
        <span class="name">後差速 <span class="unit">K</span></span>
        <div class="diff-control">
          <input class="value diff-input" id="diff-rear" type="text" inputmode="decimal" value="7" placeholder="油號(K)" aria-label="後差速，單位 K">
          <button class="spool-btn" type="button" data-spool-target="diff-rear">直軸</button>
        </div>
      </div>
    </section>

    <div class="section-title"><h3>擺臂墊片</h3><small>內 / 外</small></div>
    <section class="group">
      <div class="row head"><span></span><span>內</span><span>外</span></div>
      <div class="row"><span class="name">前上擺墊片 <span class="unit">mm</span></span><input class="value" type="text" inputmode="decimal" value="1" aria-label="前上擺墊片 內，單位 mm"><input class="value" type="text" inputmode="decimal" value="2" aria-label="前上擺墊片 外，單位 mm"></div>
      <div class="row"><span class="name">前下擺墊片 <span class="unit">mm</span></span><input class="value" type="text" inputmode="decimal" value="1" aria-label="前下擺墊片 內，單位 mm"><input class="value" type="text" inputmode="decimal" value="1" aria-label="前下擺墊片 外，單位 mm"></div>
      <div class="row"><span class="name">後上擺墊片 <span class="unit">mm</span></span><input class="value" type="text" inputmode="decimal" value="1" aria-label="後上擺墊片 內，單位 mm"><input class="value" type="text" inputmode="decimal" value="2" aria-label="後上擺墊片 外，單位 mm"></div>
      <div class="row"><span class="name">後下擺墊片 <span class="unit">mm</span></span><input class="value" type="text" inputmode="decimal" value="1" aria-label="後下擺墊片 內，單位 mm"><input class="value" type="text" inputmode="decimal" value="1" aria-label="後下擺墊片 外，單位 mm"></div>
    </section>
  </main>

  <!-- 束角鍵盤負號快捷工具列 -->
  <div class="sign-bar" id="sign-bar" role="toolbar" aria-label="束角負號快捷鍵">
    <span class="sign-bar-label" id="sign-bar-label">束角 Toe</span>
    <div class="sign-bar-actions">
      <button class="sign-key" id="toggle-minus" type="button" aria-label="切換負號">－ / ＋</button>
      <button class="sign-key secondary" id="clear-toe" type="button">清除</button>
      <button class="sign-key primary" id="next-toe" type="button">下一項</button>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite">設定已儲存</div>
  <div class="bottom"><button class="save" id="save" type="button">儲存設定</button></div>
  <dialog id="compare-dialog">
    <div class="dialog-head"><h2>比較設定</h2><button class="close" type="button" data-close>完成</button></div>
    <div class="compare-choice">
      <label>設定 A<select id="compare-a"></select></label>
      <label>設定 B<select id="compare-b"></select></label>
    </div>
    <div class="compare-toolbar">
      <label class="compare-filter"><input type="checkbox" id="diff-only"> 只顯示有差異項目</label>
      <span class="diff-badge" id="diff-count">0 項差異</span>
    </div>
    <div class="comparison" id="comparison" aria-live="polite"></div>
  </dialog>
  <dialog id="chassis-dialog">
    <div class="dialog-head"><h2>車架管理</h2><button class="close" type="button" data-chassis-close>完成</button></div>
    <div class="chassis-list" id="chassis-list"></div>
    <div class="new-chassis"><input id="new-chassis-name" placeholder="新車架名稱" aria-label="新車架名稱"><button class="btn-primary" id="add-chassis" type="button">新增</button></div>
  </dialog>
  <script>
    const inputs = [...document.querySelectorAll('.value')];
    const storeKey = 'rc-setup-book-v3';
    const legacyStoreKey = 'rc-setup-history-v2';
    const labels = inputs.map(input => input.getAttribute('aria-label').split('，')[0]);
    const baseline = inputs.map(input => input.value);
    const now = new Date().toISOString();
    const todayStr = () => {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    };
    const oldVersions = JSON.parse(localStorage.getItem(legacyStoreKey) || 'null');
    const oldValues = JSON.parse(localStorage.getItem('rc-setup-01') || 'null');
    const migrateValues = values => values && values.length === inputs.length - 1 ? [...values.slice(0, 14), '', values[14], ...values.slice(15)] : (values || baseline);

    const normalizeSetup = setup => {
      const created = setup.createdAt || setup.date || now;
      const updated = setup.updatedAt || setup.date || now;
      const hasNewFields = typeof setup.track === 'string' || typeof setup.setupDate === 'string' || typeof setup.note === 'string';
      return {
        ...setup,
        track: hasNewFields ? (setup.track || '') : '',
        setupDate: hasNewFields ? (setup.setupDate || '') : (created.slice(0, 10) || todayStr()),
        note: hasNewFields ? (setup.note || '') : (setup.name || 'Setup 01'),
        createdAt: created,
        updatedAt: updated,
        values: migrateValues(setup.values)
      };
    };

    const getSetupTitle = v => {
      const head = [v.track, v.setupDate].filter(Boolean).join(' · ');
      if (head && v.note) return `${head}（${v.note}）`;
      return head || v.note || v.name || '未命名設定';
    };

    const getSetupPrimary = v => [v.track, v.setupDate].filter(Boolean).join(' · ') || v.note || v.name || '未命名設定';
    const getSetupSecondary = v => ([v.track, v.setupDate].some(Boolean) && v.note) ? v.note : '';

    let appData = JSON.parse(localStorage.getItem(storeKey) || 'null') || {
      activeChassisId: crypto.randomUUID(), activeSetupId: null, chassis: []
    };
    if (!appData.chassis.length) {
      const setups = (oldVersions || [{ id:crypto.randomUUID(), track:'', setupDate:todayStr(), note:'Setup 01', createdAt:now, updatedAt:now, values:oldValues || baseline }]).map(version => normalizeSetup({
        ...version,
        id: version.id || crypto.randomUUID()
      }));
      appData.chassis = [{ id:appData.activeChassisId, name:'RC Touring', createdAt:now, setups }];
      appData.activeSetupId = setups[0].id;
    }
    appData.chassis.forEach(chassis => chassis.setups = chassis.setups.map(normalizeSetup));

    let activeChassisId = appData.activeChassisId || appData.chassis[0].id;
    let activeId = appData.activeSetupId || appData.chassis[0].setups[0].id;
    const toast = document.querySelector('#toast'), status = document.querySelector('#status');
    const trackInput = document.querySelector('#setup-track');
    const dateInput = document.querySelector('#setup-date');
    const noteInput = document.querySelector('#setup-note');
    const trackChips = [...document.querySelectorAll('.track-chip')];
    const spoolButtons = [...document.querySelectorAll('.spool-btn')];

    const activeChassis = () => appData.chassis.find(chassis => chassis.id === activeChassisId);
    const setups = () => activeChassis().setups;
    const activeVersion = () => setups().find(version => version.id === activeId);
    const saveHistory = () => { appData.activeChassisId = activeChassisId; appData.activeSetupId = activeId; localStorage.setItem(storeKey, JSON.stringify(appData)); };
    const readValues = () => inputs.map(input => input.value.trim());
    const formatDate = date => new Intl.DateTimeFormat('zh-TW',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(date));
    const showToast = message => { toast.textContent = message; toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 2200); };

    // 同步場地快速選單高亮狀態
    const syncTrackChips = () => {
      const current = trackInput.value.trim();
      trackChips.forEach(chip => chip.classList.toggle('active', chip.dataset.track === current));
    };

    trackChips.forEach(chip => {
      chip.addEventListener('click', () => {
        const name = chip.dataset.track;
        trackInput.value = trackInput.value.trim() === name ? '' : name;
        syncTrackChips();
        status.textContent = '未儲存變更';
      });
    });
    trackInput.addEventListener('input', syncTrackChips);

    // 同步差速器「直軸」按鈕狀態
    const syncSpoolButtons = () => {
      spoolButtons.forEach(btn => {
        const target = document.getElementById(btn.dataset.spoolTarget);
        const isSpool = target && target.value.trim() === '直軸';
        btn.classList.toggle('active', isSpool);
      });
    };

    spoolButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        const target = document.getElementById(btn.dataset.spoolTarget);
        if (!target) return;
        if (target.value.trim() === '直軸') {
          target.value = '';
          target.focus();
        } else {
          target.value = '直軸';
        }
        syncSpoolButtons();
        status.textContent = '未儲存變更';
      });
    });

    document.querySelectorAll('.diff-input').forEach(diffEl => {
      diffEl.addEventListener('focus', () => {
        if (diffEl.value.trim() === '直軸') {
          diffEl.select();
        }
      });
      diffEl.addEventListener('input', syncSpoolButtons);
    });

    const loadVersion = id => {
      const version = setups().find(item => item.id === id); if (!version) return;
      activeId = id; version.values.forEach((value, i) => inputs[i].value = value);
      document.querySelector('#chassis-display').textContent = activeChassis().name;
      trackInput.value = version.track || '';
      dateInput.value = version.setupDate || '';
      noteInput.value = version.note || '';
      syncTrackChips();
      syncSpoolButtons();
      document.querySelector('#created-at').textContent = `建立：${formatDate(version.createdAt)}`;
      document.querySelector('#updated-at').textContent = `最後儲存：${formatDate(version.updatedAt)}`;
      status.textContent = '已載入'; renderHistory();
    };

    const deleteVersion = id => {
      if (setups().length <= 1) return;
      const target = setups().find(item => item.id === id);
      if (!target || !confirm(`確定要刪除設定版本「${getSetupTitle(target)}」嗎？`)) return;
      const idx = setups().findIndex(item => item.id === id);
      setups().splice(idx, 1);
      if (activeId === id) {
        activeId = setups()[Math.min(idx, setups().length - 1)].id;
        loadVersion(activeId);
      } else {
        renderHistory();
      }
      saveHistory();
      showToast(`已刪除「${getSetupPrimary(target)}」`);
    };

    const renderHistory = () => {
      const history = document.querySelector('#history');
      const canDelete = setups().length > 1;
      history.innerHTML = setups().map(version => {
        const primary = getSetupPrimary(version);
        const secondary = getSetupSecondary(version);
        return `
        <div class="history-item ${version.id === activeId ? 'active' : ''}">
          <button class="history-select" type="button" data-id="${version.id}">
            <span>
              <span class="history-name">${primary}</span>
              ${secondary ? `<span class="history-note">${secondary}</span>` : ''}
              <span class="history-date">最後儲存：${formatDate(version.updatedAt)}${version.id === activeId ? ' · 目前編輯中' : ''}</span>
            </span>
            <span class="history-arrow">›</span>
          </button>
          <button class="delete-inline" type="button" data-del-version="${version.id}" ${canDelete ? '' : 'disabled'} aria-label="刪除 ${primary}">刪除</button>
        </div>
      `;
      }).join('');
      document.querySelector('#history-count').textContent = `${setups().length} 個版本`;
      history.querySelectorAll('[data-id]').forEach(button => button.addEventListener('click', () => loadVersion(button.dataset.id)));
      history.querySelectorAll('[data-del-version]').forEach(button => button.addEventListener('click', () => deleteVersion(button.dataset.delVersion)));
    };

    const saveCurrentSetup = () => {
      const version = activeVersion();
      version.track = trackInput.value.trim();
      version.setupDate = dateInput.value;
      version.note = noteInput.value.trim();
      version.values = readValues();
      version.updatedAt = new Date().toISOString();
      saveHistory();
      status.textContent = '剛剛儲存';
      renderHistory();
      showToast('設定已更新');
    };

    document.querySelector('#save').addEventListener('click', saveCurrentSetup);

    document.querySelector('#new-version').addEventListener('click', () => {
      const createdAt = new Date().toISOString();
      const version = {
        id: crypto.randomUUID(),
        track: trackInput.value.trim(),
        setupDate: todayStr(),
        note: `Setup ${String(setups().length + 1).padStart(2,'0')}`,
        createdAt,
        updatedAt: createdAt,
        values: readValues()
      };
      setups().unshift(version); activeId = version.id; saveHistory(); loadVersion(version.id);
      status.textContent = '新版本'; showToast('已建立新版本');
    });

    // 上方場地 / 日期 / 備註欄位操作與 Enter 跳轉
    [trackInput, dateInput, noteInput].forEach((el, idx, arr) => {
      el.addEventListener('input', () => { status.textContent = '未儲存變更'; });
      el.addEventListener('keydown', e => {
        if (e.key === 'Enter') {
          e.preventDefault();
          if (arr[idx + 1]) {
            arr[idx + 1].focus();
          } else {
            inputs[0]?.focus();
          }
        }
      });
    });

    // 束角 Toe 鍵盤負號快捷工具列控制
    const signBar = document.querySelector('#sign-bar');
    const signBarLabel = document.querySelector('#sign-bar-label');
    let activeToeInput = null;

    const updateSignBarPosition = () => {
      if (!signBar.classList.contains('show')) return;
      if (window.visualViewport) {
        const vv = window.visualViewport;
        const bottomOffset = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
        signBar.style.bottom = `${bottomOffset}px`;
      }
    };

    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', updateSignBarPosition);
      window.visualViewport.addEventListener('scroll', updateSignBarPosition);
    }

    document.querySelectorAll('.toe-input').forEach(toeEl => {
      toeEl.addEventListener('focus', () => {
        activeToeInput = toeEl;
        signBarLabel.textContent = toeEl.getAttribute('aria-label').split('，')[0];
        signBar.classList.add('show');
        updateSignBarPosition();
      });
      toeEl.addEventListener('blur', () => {
        setTimeout(() => {
          if (!document.activeElement || !document.activeElement.classList.contains('toe-input')) {
            signBar.classList.remove('show');
            signBar.style.bottom = '0px';
            activeToeInput = null;
          }
        }, 120);
      });
    });

    // 點擊負號快捷鍵時避免搶走輸入框焦點
    signBar.addEventListener('mousedown', e => e.preventDefault());
    signBar.addEventListener('touchstart', e => {
      if (e.target.closest('button')) e.preventDefault();
    }, { passive: false });

    document.querySelector('#toggle-minus').addEventListener('click', () => {
      if (!activeToeInput) return;
      const raw = activeToeInput.value.trim();
      if (raw === '') {
        activeToeInput.value = '-';
      } else if (raw === '-') {
        activeToeInput.value = '';
      } else if (raw.startsWith('-')) {
        activeToeInput.value = raw.slice(1);
      } else {
        activeToeInput.value = `-${raw}`;
      }
      status.textContent = '未儲存變更';
    });

    document.querySelector('#clear-toe').addEventListener('click', () => {
      if (!activeToeInput) return;
      activeToeInput.value = '';
      status.textContent = '未儲存變更';
    });

    document.querySelector('#next-toe').addEventListener('click', () => {
      if (!activeToeInput) return;
      const idx = inputs.indexOf(activeToeInput);
      if (inputs[idx + 1]) inputs[idx + 1].focus();
    });

    // 數值輸入框鍵盤快速鍵與操作優化
    inputs.forEach((input, idx) => {
      input.setAttribute('enterkeyhint', idx < inputs.length - 1 ? 'next' : 'done');
      input.addEventListener('focus', () => input.select());
      input.addEventListener('input', () => { status.textContent = '未儲存變更'; });
      input.addEventListener('keydown', e => {
        if (e.key === 'Enter') {
          e.preventDefault();
          const nextIdx = e.shiftKey ? idx - 1 : idx + 1;
          if (inputs[nextIdx]) {
            inputs[nextIdx].focus();
          } else {
            input.blur();
          }
        } else if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
          const raw = input.value.trim();
          const num = parseFloat(raw);
          if (raw !== '' && !Number.isNaN(num) && /^-?\d+(\.\d+)?$/.test(raw)) {
            e.preventDefault();
            const step = e.shiftKey ? 0.5 : 0.1;
            const delta = e.key === 'ArrowUp' ? step : -step;
            const decimals = Math.max((raw.split('.')[1] || '').length, 1);
            const nextVal = Number((num + delta).toFixed(decimals));
            input.value = String(nextVal);
            input.select();
            status.textContent = '未儲存變更';
          }
        } else if (e.key === 'Escape') {
          input.blur();
        }
      });
    });

    // 全域 Ctrl+S / Cmd+S 快速儲存
    document.addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
        e.preventDefault();
        saveCurrentSetup();
      }
    });

    // 設定比較與差異高亮
    const dialog = document.querySelector('#compare-dialog'), selectA = document.querySelector('#compare-a'), selectB = document.querySelector('#compare-b');
    const diffOnlyCheckbox = document.querySelector('#diff-only'), diffCountBadge = document.querySelector('#diff-count');
    const renderComparison = () => {
      const a = setups().find(version => version.id === selectA.value), b = setups().find(version => version.id === selectB.value); if (!a || !b) return;
      const rows = labels.map((label, index) => {
        const valA = a.values[index] || '—';
        const valB = b.values[index] || '—';
        const isChanged = (a.values[index] || '') !== (b.values[index] || '');
        return { label, valA, valB, isChanged };
      });
      const changedCount = rows.filter(r => r.isChanged).length;
      diffCountBadge.textContent = `${changedCount} 項差異`;
      const visibleRows = diffOnlyCheckbox.checked ? rows.filter(r => r.isChanged) : rows;
      const bodyHtml = visibleRows.length
        ? visibleRows.map(r => `<div class="comparison-row ${r.isChanged ? 'changed' : ''}"><span>${r.label}</span><span>${r.valA}</span><span>${r.valB}</span></div>`).join('')
        : `<div class="comparison-empty">兩組設定的所有參數皆相同</div>`;
      document.querySelector('#comparison').innerHTML = `<div class="comparison-row heading"><span>參數</span><span>${getSetupPrimary(a)}</span><span>${getSetupPrimary(b)}</span></div>` + bodyHtml;
    };

    document.querySelector('#compare').addEventListener('click', () => {
      const options = setups().map(version => `<option value="${version.id}">${getSetupTitle(version)}</option>`).join('');
      selectA.innerHTML = options; selectB.innerHTML = options; selectA.value = activeId;
      selectB.value = setups().find(version => version.id !== activeId)?.id || activeId; renderComparison(); dialog.showModal();
    });
    selectA.addEventListener('change', renderComparison);
    selectB.addEventListener('change', renderComparison);
    diffOnlyCheckbox.addEventListener('change', renderComparison);
    document.querySelector('[data-close]').addEventListener('click', () => dialog.close());

    // 車架管理（含刪除車架）
    const chassisDialog = document.querySelector('#chassis-dialog');
    const deleteChassis = id => {
      if (appData.chassis.length <= 1) return;
      const target = appData.chassis.find(c => c.id === id);
      if (!target || !confirm(`確定要刪除車架「${target.name}」及其所有 ${target.setups.length} 個設定版本嗎？`)) return;
      const idx = appData.chassis.findIndex(c => c.id === id);
      appData.chassis.splice(idx, 1);
      if (activeChassisId === id) {
        activeChassisId = appData.chassis[Math.min(idx, appData.chassis.length - 1)].id;
        activeId = activeChassis().setups[0].id;
        loadVersion(activeId);
      }
      saveHistory();
      renderChassis();
      showToast(`已刪除車架「${target.name}」`);
    };

    const renderChassis = () => {
      const canDelete = appData.chassis.length > 1;
      document.querySelector('#chassis-list').innerHTML = appData.chassis.map(chassis => `
        <div class="chassis-item ${chassis.id === activeChassisId ? 'active' : ''}">
          <button class="chassis-select" data-chassis-id="${chassis.id}" type="button">
            <span>${chassis.name}<br><small>${chassis.setups.length} 個設定版本</small></span>
            <span class="history-arrow">›</span>
          </button>
          <button class="delete-inline" type="button" data-del-chassis="${chassis.id}" ${canDelete ? '' : 'disabled'} aria-label="刪除車架 ${chassis.name}">刪除</button>
        </div>
      `).join('');
      document.querySelectorAll('[data-chassis-id]').forEach(button => button.addEventListener('click', () => {
        activeChassisId = button.dataset.chassisId; activeId = activeChassis().setups[0].id; saveHistory(); loadVersion(activeId); chassisDialog.close();
      }));
      document.querySelectorAll('[data-del-chassis]').forEach(button => button.addEventListener('click', () => deleteChassis(button.dataset.delChassis)));
    };

    document.querySelector('#manage-chassis').addEventListener('click', () => { renderChassis(); chassisDialog.showModal(); });
    document.querySelector('[data-chassis-close]').addEventListener('click', () => chassisDialog.close());
    const addChassisAction = () => {
      const nameInput = document.querySelector('#new-chassis-name');
      const name = nameInput.
